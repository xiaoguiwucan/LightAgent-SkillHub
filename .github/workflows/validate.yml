name: 技能校验
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/build_registry.py --output dist
      - name: Official Docker non-root smoke test
        run: docker run --rm --user agent --entrypoint python -v "$PWD:/hub:ro" -w /hub yideng966/lightagent:latest scripts/docker_smoke.py
      - uses: actions/checkout@v4
        with:
          repository: yideng966/LightAgent
          ref: master
          path: lightagent-main
      - name: Current LightAgent main compatibility test
        run: docker run --rm --user agent --entrypoint python -e PYTHONPATH=/lightagent-main -v "$PWD:/hub:ro" -v "$PWD/lightagent-main:/lightagent-main:ro" -w /hub yideng966/lightagent:latest scripts/lightagent_main_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: skillhub-preview
          path: dist
